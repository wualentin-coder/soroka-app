<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сорока</title>
<link rel="preconnect" href="https://snruckyliflxzpzybozr.functions.supabase.co" crossorigin>
<script defer src="./telegram-web-app.js?v=63"></script>
<style>
  /*
   * Цвета берём у Telegram, а не выбираем свои: приложение открывается внутри
   * мессенджера, и чужая палитра там выглядит именно чужой. Значения приходят
   * переменными темы, тёмная и светлая меняются сами.
   */
  :root {
    --bg: var(--tg-theme-bg-color, #17212b);
    --card: var(--tg-theme-secondary-bg-color, #232e3c);
    --text: var(--tg-theme-text-color, #f5f5f5);
    --dim: var(--tg-theme-hint-color, #8c9aa8);
    --link: var(--tg-theme-link-color, #6ab3f3);
    --accent: var(--tg-theme-button-color, #5288c1);
    --danger: #e8735a;
    --ok: #6cc070;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 12px 12px 32px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 17px; margin: 0 0 12px; font-weight: 600; }
  h2 { font-size: 13px; margin: 0 0 8px; color: var(--dim); font-weight: 600;
       text-transform: uppercase; letter-spacing: .04em; }

  nav { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 2px; }
  nav button {
    flex: 0 0 auto; border: 0; border-radius: 9px; padding: 8px 13px;
    background: var(--card); color: var(--dim); font-size: 14px; font-weight: 500;
    cursor: pointer;
  }
  nav button[aria-current="true"] { background: var(--accent); color: #fff; }

  .card { background: var(--card); border-radius: 12px; padding: 13px 14px; margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .row + .row { margin-top: 9px; }
  .sum { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .dim { color: var(--dim); }
  .small { font-size: 13px; }
  .danger { color: var(--danger); }
  .ok { color: var(--ok); }

  .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); margin-top: 7px;
         overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .bar.over span { background: var(--danger); }

  .item { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; }
  .item + .item { border-top: 1px solid rgba(255,255,255,.07); }
  .item .body { flex: 1; min-width: 0; }
  .item .title { overflow-wrap: anywhere; }
  .tick {
    flex: 0 0 auto; width: 26px; height: 26px; border-radius: 8px; border: 0;
    background: rgba(255,255,255,.1); color: var(--text); cursor: pointer; font-size: 14px;
  }
  .tick:active { background: var(--accent); }
  a { color: var(--link); text-decoration: none; }
  .empty { color: var(--dim); text-align: center; padding: 28px 0; }

  .add { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .add input { flex: 1 1 120px; min-width: 0; border: 0; border-radius: 9px; padding: 9px 11px;
               background: rgba(255,255,255,.08); color: var(--text); font-size: 14px; }
  .add button { flex: 0 0 auto; border: 0; border-radius: 9px; padding: 9px 14px;
                background: var(--accent); color: #fff; font-size: 14px; cursor: pointer; }

  .cal-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin: 10px 0 4px;
              font-size: 11px; color: var(--dim); text-align: center; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-day { position: relative; aspect-ratio: 1; border: 0; border-radius: 8px;
             background: rgba(255,255,255,.05); color: var(--text); font-size: 13px;
             cursor: pointer; padding: 0; }
  .cal-empty { background: none; }
  .cal-today { outline: 1px solid var(--accent); }
  .cal-pick { background: var(--accent); color: #fff; }
  .cal-dot { position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%);
             width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
  .cal-pick .cal-dot { background: #fff; }
  body { max-width: 720px; margin: auto; padding: max(20px, env(safe-area-inset-top)) 16px 110px; }
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; gap:12px; }
  header h1 { font-size:24px; letter-spacing:-.7px; margin:0; }
  button { font:inherit; cursor:pointer; }
  button:focus-visible, a:focus-visible { outline:2px solid var(--link); outline-offset:3px; }
  button:disabled { opacity:.5; cursor:wait; }
  .action { min-height:44px; padding:10px 14px; border:0; border-radius:10px; color:var(--text); background:var(--card); }
  nav { position:fixed; bottom:0; left:0; right:0; z-index:5; margin:0; padding:10px 6px max(10px, env(safe-area-inset-bottom)); background:var(--bg); border-top:1px solid var(--dim); display:grid; grid-template-columns:repeat(3,1fr); gap:2px; }
  nav button { min-height:48px; padding:8px 2px; font-size:12px; background:transparent; }
  .card { padding:18px; border-radius:16px; margin-bottom:12px; }
  .row { flex-wrap:wrap; }
  .tick { width:44px; height:44px; border-radius:12px; }
  h2 { text-transform:none; letter-spacing:0; font-size:16px; color:var(--text); }
  .notice { margin:12px 0; padding:12px; border-left:3px solid var(--accent); }
  #status { color:var(--danger); margin:12px 0; }
  body { padding-bottom: calc(142px + env(safe-area-inset-bottom)); }
  .vault-field { display:block; margin:10px 0; color:var(--dim); font-size:13px; }
  .vault-field input, .vault-field textarea { display:block; width:100%; min-height:44px; margin-top:4px; padding:10px 12px; border:1px solid var(--dim); border-radius:9px; background:var(--bg); color:var(--text); font:inherit; }
  .vault-field textarea { min-height:72px; resize:vertical; }
  .vault-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .vault-secret { overflow-wrap:anywhere; white-space:pre-wrap; user-select:text; }
  .segment { display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; margin-bottom:10px; }
  .segment button { flex:none; min-height:40px; padding:8px 12px; border:0; border-radius:9px; background:var(--card); color:var(--dim); }
  .segment button[aria-current="true"] { background:var(--accent); color:#fff; }
  .editor-field { display:block; margin:12px 0; color:var(--dim); font-size:13px; }
  .editor-field input, .editor-field textarea { display:block; width:100%; min-height:44px; margin-top:4px; padding:10px 12px; border:1px solid var(--dim); border-radius:9px; background:var(--bg); color:var(--text); font:inherit; }
  .editor-field textarea { min-height:160px; resize:vertical; }
  .compact-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .compact-actions .action { flex:1 1 auto; }
  .note-text { white-space:pre-wrap; overflow-wrap:anywhere; }
  header { flex-wrap:wrap; }
  header > div { display:flex; flex-wrap:wrap; gap:4px; justify-content:flex-end; }
  header .action { min-height:40px; padding:8px 9px; font-size:13px; }
</style>
</head>
<body>
<div id="root"><div class="empty">Загружаю…</div></div>

<script>
let tg = null;

const API = "https://snruckyliflxzpzybozr.functions.supabase.co/soroka-app";
const root = document.getElementById("root");
let data = null;
let tab = new URLSearchParams(location.search).get("tab") === "vault" ? "vault" : "today";
const requestedVaultId = Number(new URLSearchParams(location.search).get("id"));
const vaultTargetId = Number.isSafeInteger(requestedVaultId) && requestedVaultId > 0 ? requestedVaultId : null;
let busy = false;
let snapshotRequest = null;
let snapshotError = "";
let vaultEntries = null;
let vaultEditId = null;
let vaultShown = null;
let vaultTimer = null;
let librarySection = "notes";
let noteOpen = null;
let searchOpen = false;
let searchQuery = "";
let searchHits = null;
let searchPage = 0;
let searchHasMore = false;
let settingsOpen = false;
let settingsData = null;
let linkEdit = null;
let lists = null;
let listEdit = null;
let taskEdit = null;
let recordOpen = null;

const SIGNS = { RUB: "₽", USD: "$", EUR: "€" };
const KIND_LABELS = { note: 'Заметка', task: 'Дело', event: 'Событие', link: 'Материал',
  list: 'Список', movie: 'Фильм', recipe: 'Рецепт', product: 'Товар', money: 'Финансы',
  debt: 'Долг', payment: 'Платёж', shopping: 'Покупка', project: 'Проект' };

function money(amount, currency) {
  const value = Number(amount || 0);
  // Копейки показываем только когда они есть: «6 000 ₽» читается быстрее,
  // чем «6 000,00 ₽», а в чеке важна каждая.
  const text = value.toLocaleString("ru-RU", {
    minimumFractionDigits: Number.isInteger(value) ? 0 : 2,
    maximumFractionDigits: 2,
  });
  return text + " " + esc(SIGNS[currency] || currency || "");
}

function esc(text) {
  return String(text ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': '&quot;', "'": '&#39;' }[c]));
}
function safeLink(url) {
  try { const parsed = new URL(url); return ['https:', 'http:'].includes(parsed.protocol) ? esc(parsed.href) : ''; }
  catch { return ''; }
}

async function call(body) {
  // Подпись Telegram — единственное доказательство, что это владелец. Её нет,
  // когда страницу открыли не из мессенджера: по ссылке в браузере, из
  // сохранённых вкладок, из истории. Сервер в этом случае ответит одинаковым
  // отказом, и человек будет думать, что дело в правах, — поэтому проверяем
  // здесь и говорим прямо.
  const init = tg?.initData || "";
  if (!init) throw new Error("no-telegram");

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 15000);
  let answer;
  try {
    answer = await fetch(API, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ initData: init, ...body }),
      signal: controller.signal,
    });
  } finally {
    clearTimeout(timeout);
  }
  if (!answer.ok) {
    const code = await answer.json().catch(() => ({}));
    throw new Error(code.error === "reopen_app" ? "reopen_app" : answer.status === 401 ? "unauthorized" : "server");
  }
  return await answer.json();
}

function card(inner) { return '<div class="card">' + inner + "</div>"; }

function moneyTab() {
  const out = [];

  out.push(card(
    '<h2>Счета</h2>' +
    data.accounts.map((a) =>
      '<div class="row"><span>' + esc(a.name) + '</span>' +
      '<span class="sum">' + money(a.balance, a.currency) + "</span></div>"
    ).join("")
  ));

  const totals = data.totals.map((t) =>
    '<div class="row"><span class="dim">Доходы</span><span class="sum ok">' +
      money(t.income, t.currency) + "</span></div>" +
    '<div class="row"><span class="dim">Расходы</span><span class="sum">' +
      money(t.expense, t.currency) + "</span></div>" +
    '<div class="row"><span>Итого</span><span class="sum ' +
      (t.income - t.expense < 0 ? "danger" : "ok") + '">' +
      money(t.income - t.expense, t.currency) + "</span></div>"
  ).join("");
  out.push(card("<h2>" + esc(data.month) + "</h2>" + (totals || '<div class="dim">Операций нет</div>')));

  if (data.payments.length) {
    out.push(card(
      '<h2>Ждут подтверждения</h2>' +
      data.payments.map((p) =>
        '<div class="row"><span class="' + (p.overdue > 0 ? "danger" : "") + '">' +
        esc(p.title) + "</span>" +
        '<span class="sum">' + money(p.amount, p.currency) + "</span></div>"
      ).join("") +
      '<div class="small dim" style="margin-top:9px">В чате напиши «подтвердить списания».</div>'
    ));
  }

  if (data.budgets.length) {
    out.push(card(
      "<h2>Бюджеты</h2>" +
      data.budgets.map((b) => {
        const share = Math.min(1.4, Number(b.spent) / Number(b.limit_amount || 1));
        const over = share >= 1 || (b.over_on && b.over_on <= b.days_in_month);
        return '<div style="margin-bottom:12px">' +
          '<div class="row"><span>' + esc(b.category) + "</span>" +
          '<span class="sum ' + (over ? "danger" : "") + '">' +
          money(b.spent, b.currency) + ' <span class="dim">из ' +
          money(b.limit_amount, b.currency) + "</span></span></div>" +
          '<div class="bar' + (over ? " over" : "") + '"><span style="width:' +
          Math.min(100, share * 100) + '%"></span></div>' +
          (b.over_on && b.over_on <= b.days_in_month
            ? '<div class="small danger" style="margin-top:5px">Хватит до ' + b.over_on + "-го</div>"
            : "") +
          "</div>";
      }).join("")
    ));
  }

  const debts = data.debts.filter((d) => d.mine || d.theirs);
  if (debts.length) {
    out.push(card(
      "<h2>Долги</h2>" +
      debts.map((d) =>
        (d.mine ? '<div class="row"><span>Должны мне</span><span class="sum ok">' +
          money(d.mine, d.currency) + "</span></div>" : "") +
        (d.theirs ? '<div class="row"><span>Должен я</span><span class="sum danger">' +
          money(d.theirs, d.currency) + "</span></div>" : "")
      ).join("")
    ));
  }

  if (data.obligations.length) {
    out.push(card(
      "<h2>Обязательные платежи</h2>" +
      data.obligations.map((o) =>
        '<div class="row"><span class="dim">В месяц</span><span class="sum">' +
          money(o.total, o.currency) + "</span></div>" +
        '<div class="row"><span class="dim">В год</span><span class="sum">' +
          money(o.total * 12, o.currency) + "</span></div>"
      ).join("")
    ));
  }

  return out.join("");
}

function reportTab() {
  if (!data.categories.length) return '<div class="empty">Трат в этом месяце нет</div>';
  const max = Math.max(...data.categories.map((c) => Number(c.amount)));
  return card(
    "<h2>Куда ушли деньги · " + esc(data.month) + "</h2>" +
    data.categories.map((c) =>
      '<div style="margin-bottom:11px">' +
      '<div class="row"><span>' + esc(c.name) + "</span>" +
      '<span class="sum">' + money(c.amount, c.currency) + "</span></div>" +
      '<div class="bar"><span style="width:' + (Number(c.amount) / max * 100) + '%"></span></div>' +
      "</div>"
    ).join("")
  );
}

function doingTab(todayOnly = false) {
  if (taskEdit) return card('<button class="action" data-task-back="1">К делам</button>' +
    '<label class="editor-field">Дело<input id="edit-task-title" maxlength="200" value="' + esc(taskEdit.title) + '"></label>' +
    '<label class="editor-field">Срок<input id="edit-task-due" type="date" value="' + esc(taskEdit.due_on || '') + '"></label>' +
    '<label class="editor-field">Важность<select id="edit-task-priority" class="action">' +
      [[1, 'Очень важно'], [2, 'Важно'], [3, 'Обычно'], [4, 'Низко'], [5, 'Когда-нибудь']].map(([n, label]) =>
        '<option value="' + n + '"' + (Number(taskEdit.priority) === n ? ' selected' : '') + '>' + label + '</option>'
      ).join('') + '</select></label><button class="action" data-task-save="1">Сохранить</button>');
  const out = [];
  const tasks = todayOnly ? data.tasks.filter(t => t.due_on && t.due_on <= data.today) : data.tasks;
  const events = todayOnly ? data.events.filter(e => new Date(e.starts_at).toLocaleDateString('en-CA', { timeZone: data.timezone || 'Europe/Moscow' }) === data.today) : data.events;
  if (todayOnly) out.push(card('<h2>План на сегодня</h2><p class="small dim">' +
    (tasks.length ? tasks.length + ' открытых дел' : 'Открытых дел нет') + '</p>' +
    '<div class="add"><input id="task-title" placeholder="Что сделать сегодня" maxlength="200">' +
    '<input id="task-due" type="date" value="' + data.today + '">' +
    '<button data-task-add="1">Добавить</button></div>'));

  const overdue = tasks.filter((t) => t.due_on && t.due_on < data.today);
  const rest = tasks.filter((t) => !(t.due_on && t.due_on < data.today));

  const line = (t) =>
    '<div class="item"><button class="tick" aria-label="Завершить: ' + esc(t.title) + '" data-task="' + t.id + '">✓</button>' +
    '<div class="body"><div class="title">' + esc(t.title) + "</div>" +
    (t.due_on
      ? '<div class="small ' + (t.due_on < data.today ? "danger" : "dim") + '">' +
        new Date(t.due_on).toLocaleDateString("ru-RU", { day: "numeric", month: "long" }) + "</div>"
      : "") +
    (Number(t.priority) <= 2 ? '<div class="small dim">Важное</div>' : '') +
    "</div>" +
    '<button class="tick" data-task-edit="' + t.id + '" aria-label="Изменить дело">⋯</button>' +
    '<button class="tick" data-task-del="' + t.id + '" aria-label="Удалить дело">×</button></div>';

  if (overdue.length) out.push(card("<h2>⚠️ Просрочено</h2>" + overdue.map(line).join("")));
  if (rest.length) out.push(card("<h2>" + (todayOnly ? "Сегодня" : "Дела") + "</h2>" + rest.map(line).join("")));
  if (events.length) {
    out.push(card("<h2>События</h2>" + events.map((e) => {
      const at = new Date(e.starts_at);
      const when = at.toLocaleString("ru-RU", {
        timeZone: data.timezone || "Europe/Moscow",
        day: "numeric", month: "long", year: at.getUTCFullYear() === Number(data.today.slice(0, 4)) ? undefined : "numeric",
        hour: "2-digit", minute: "2-digit",
      });
      return '<div class="item"><div class="body"><div class="title">' + esc(e.title) +
        '</div><div class="small dim">' + when + "</div></div>" +
        '<button class="tick" data-record-open="event:' + e.id + '" aria-label="Изменить событие">⋯</button>' +
        '<button class="tick" data-event-del="' + e.id + '" aria-label="Удалить событие">×</button></div>';
    }).join("")));
  }
  if (!todayOnly && data.projects?.length) out.push(card('<h2>Проекты</h2>' + data.projects.map(p =>
    '<div class="item"><div class="body"><div class="title">' + esc(p.name) + '</div><p class="small dim">' +
    esc(p.about || 'Описание пока не добавлено') + '</p></div>' +
    '<button class="action" data-record-open="project:' + p.id + '">Открыть</button></div>').join('')));
  if (!todayOnly && data.archivedEvents?.length) out.push(
    '<details class="card"><summary>Архив событий · ' + data.archivedEvents.length + '</summary>' +
    data.archivedEvents.map(e => '<div class="item"><div class="body"><div class="title">' + esc(e.title) +
      '</div><div class="small dim">' + esc(new Date(e.starts_at).toLocaleString('ru-RU', {
        timeZone: data.timezone || 'Europe/Moscow', day: 'numeric', month: 'long', year: 'numeric',
        hour: '2-digit', minute: '2-digit',
      })) + '</div></div></div>').join('') + '</details>'
  );
  if (!todayOnly) out.push(card(
    "<h2>Новое дело</h2>" +
    '<div class="add"><input id="task-title" placeholder="Что сделать" maxlength="200">' +
    '<input id="task-due" type="date">' +
    '<button data-task-add="1">Добавить</button></div>'
  ));
  if (!out.length) out.push('<div class="empty">' + (todayOnly ? 'На сегодня дел нет' : 'Открытых дел нет') + "</div>");
  return out.join("");
}

function queueTab(section = "all") {
  const entries = (data.queue || []).filter(l => section === "all" ||
    (section === "posts" ? l.kind === "tg_post" :
      section === "files" ? l.kind === "file" : l.kind !== "tg_post" && l.kind !== "file"));
  if (!entries.length) return '<div class="empty">Здесь пока пусто<br><span class="small">Пришли боту ссылку или файл.</span></div>';

  // Что можно открыть — открываем. Файл и пост живут в чате Telegram, и
  // страница туда не дотянется: у них кнопка «в чат», а отправляет бот.
  const open = entries.filter((l) => safeLink(l.url));
  const inChat = entries.filter((l) => !safeLink(l.url));

  const row = (l) =>
    '<div class="item"><button class="tick" aria-label="Отметить просмотренным: ' + esc(l.title) + '" data-link="' + l.id + '">✓</button>' +
    '<div class="body"><div class="title">' +
    (safeLink(l.url) ? '<a href="' + safeLink(l.url) + '" target="_blank" rel="noopener noreferrer">' + esc(l.title) + "</a>" : esc(l.title)) +
    "</div>" +
    '<div class="small dim">' +
    [esc(l.topic), l.est_minutes ? Number(l.est_minutes) + " мин" : "",
      ...(l.tags || []).map(tag => '#' + esc(tag))].filter(Boolean).join(" · ") +
    "</div></div>" +
    (safeLink(l.url) ? "" : '<button class="tick" data-send="' + l.id + '" aria-label="Прислать в чат">→</button>') +
    '<button class="tick" data-link-edit="' + l.id + '" aria-label="Изменить материал">⋯</button>' +
    "</div>";

  const total = open.reduce((sum, l) => sum + (l.est_minutes || 0), 0);
  const out = [];
  if (open.length) {
    out.push(card("<h2>Ссылки · " + open.length +
      (total ? " · " + Math.round(total / 60) + " ч" : "") + "</h2>" + open.map(row).join("")));
  }
  if (inChat.length) {
    out.push(card("<h2>В чате · " + inChat.length + "</h2>" + inChat.map(row).join("") +
      '<div class="small dim" style="margin-top:9px">Стрелка присылает файл или пост в чат с ботом.</div>'));
  }
  return out.join("");
}

function moveListItem(items, index, step) {
  const next = index + step;
  if (index < 0 || next < 0 || index >= items.length || next >= items.length) return items;
  const moved = items.slice();
  [moved[index], moved[next]] = [moved[next], moved[index]];
  return moved;
}

/**
 * Календарь: месяц сеткой, под ним — что в выбранный день.
 *
 * Список событий отвечает на «что дальше», но не на «свободен ли четверг» —
 * для этого нужно видеть месяц целиком. Точка под числом значит, что день
 * занят: так занятость читается, не открывая ни одного дня.
 */
let calShift = 0;
let calPick = null;

function calendarTab() {
  const base = new Date(data.today + "T12:00:00");
  base.setMonth(base.getMonth() + calShift);
  const year = base.getFullYear();
  const month = base.getMonth();

  const byDay = {};
  for (const e of data.events || []) {
    const day = new Date(e.starts_at).toLocaleDateString("en-CA", { timeZone: data.timezone || "Europe/Moscow" });
    (byDay[day] = byDay[day] || []).push(e);
  }
  for (const t of data.tasks || []) {
    if (t.due_on) (byDay[t.due_on] = byDay[t.due_on] || []).push({ title: t.title, task: true });
  }

  const first = new Date(year, month, 1);
  // Неделя начинается с понедельника: воскресенье первым — чужая привычка.
  const lead = (first.getDay() + 6) % 7;
  const days = new Date(year, month + 1, 0).getDate();

  const name = base.toLocaleDateString("ru-RU", { month: "long", year: "numeric" });
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push('<div class="cal-day cal-empty"></div>');
  for (let d = 1; d <= days; d++) {
    const iso = year + "-" + String(month + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
    const has = (byDay[iso] || []).length;
    cells.push(
      '<button class="cal-day' + (iso === data.today ? " cal-today" : "") +
      (iso === calPick ? " cal-pick" : "") + '" data-day="' + iso + '">' + d +
      (has ? '<i class="cal-dot"></i>' : "") + "</button>",
    );
  }

  const chosen = calPick || data.today;
  const list = (byDay[chosen] || []).map((e) =>
    '<div class="item"><div class="body"><div class="title">' + esc(e.title) + "</div>" +
    '<div class="small dim">' + (e.task ? "дело" :
      new Date(e.starts_at).toLocaleTimeString("ru-RU", { timeZone: data.timezone || "Europe/Moscow", hour: "2-digit", minute: "2-digit" })) +
    "</div></div>" + (e.task ? '' : '<button class="action" data-record-open="event:' + e.id + '">Открыть</button>') + '</div>'
  ).join("");

  return card(
    '<div class="row"><button class="tick" data-cal="-1">‹</button>' +
    "<h2 style=\"margin:0\">" + esc(name) + "</h2>" +
    '<button class="tick" data-cal="1">›</button></div>' +
    '<div class="cal-week">' + ["пн", "вт", "ср", "чт", "пт", "сб", "вс"]
      .map((w) => "<span>" + w + "</span>").join("") + "</div>" +
    '<div class="cal-grid">' + cells.join("") + "</div>"
  ) + card(
    "<h2>" + new Date(chosen + "T12:00:00").toLocaleDateString("ru-RU",
      { day: "numeric", month: "long" }) + "</h2>" +
    (list || '<div class="dim small">Ничего не запланировано</div>') +
    '<div class="add" style="margin-top:10px">' +
    '<input id="event-title" placeholder="Что за событие" maxlength="200">' +
    '<input id="event-time" type="time" value="12:00">' +
    '<button data-event-add="' + chosen + '">Добавить</button></div>'
  );
}

  document.getElementById("vault-service").focus();
}

function showVaultEntry(id, entry) {
  clearVaultSecret();
  vaultShown = { id, ...entry };
  document.getElementById("vault-detail").innerHTML = card(
    '<h2>' + esc(entry.service) + '</h2><p class="small dim">' + esc(entry.login || 'Без логина') + '</p>' +
    '<div id="vault-secret" class="vault-secret"></div>' +
    (entry.note ? '<p class="small">' + esc(entry.note) + '</p>' : '') +
    '<div class="vault-actions">' + (entry.login
      ? '<button class="action" data-vault-copy-login="1">Копировать логин</button>' : '') +
    '<button class="action" data-vault-copy-password="1">Копировать пароль</button>' +
    '<button class="action" data-vault-edit="1">Изменить</button>' +
    '<button class="action" data-vault-delete="1">Удалить</button>' +
    '<button class="action" data-vault-hide="1">Скрыть</button></div>'
  );
  document.getElementById("vault-secret").textContent = entry.password;
  vaultTimer = setTimeout(() => {
    clearVaultSecret();
    const detail = document.getElementById("vault-detail");
    if (detail) detail.innerHTML = '';
  }, 30000);
}

const TABS = [
  ["today", "Сегодня", () => doingTab(true)],
  ["doing", "Дела", doingTab],
  ["calendar", "Календарь", calendarTab],
  ["money", "Финансы", () => moneyTab() + '<details class="card"><summary>Расходы по категориям</summary>' + reportTab() + '</details>'],
  ["queue", "Сохранённое", libraryTab],
  ["vault", "Пароли", vaultTab],
];

function draw() {
  // «Меню» закрывает приложение и возвращает в чат, где панель бота уже
  // открыта: внутри приложения своего меню нет и не нужно — оно в боте.
  const nav = '<nav>' + TABS.map(([key, name]) =>
    '<button data-tab="' + key + '" aria-current="' + (tab === key) + '"' + (tg ? '' : ' disabled') + '>' + name + "</button>"
  ).join("") + "</nav>";
  const body = recordOpen ? recordForm() : settingsOpen ? settingsTab() : searchOpen ? searchTab() : tab === "vault" ? vaultTab() : data
    ? TABS.find(([key]) => key === tab)[2]()
    : card(snapshotError
      ? '<p>' + esc(snapshotError) + '</p><button class="action" data-refresh="1">Повторить</button>'
      : '<p class="dim">Загружаю данные…</p>');
  root.innerHTML = '<header><h1>Сорока</h1><div><button class="action" data-search-toggle="1">Поиск</button> <button class="action" data-settings-toggle="1" aria-label="Настройки">⋯</button> <button class="action" data-refresh="1" aria-label="Обновить данные">↻</button> <button class="action" data-close="1">В чат</button></div></header>' +
    '<h2>' + (recordOpen ? KIND_LABELS[recordOpen.kind] || 'Запись' : settingsOpen ? 'Настройки' : searchOpen ? 'Поиск' : TABS.find(([key]) => key === tab)[1]) + '</h2><div id="status" role="status"></div>' + body +
    (tab !== "vault" && data?.inbox ? '<div class="notice">Неразобранное · ' + data.inbox + '<br><span class="small">Открой «Неразобранное» в чате, чтобы исправить записи.</span></div>' : '') +
    nav;
}

/** Действие с обновлением экрана и защитой от двойного нажатия. */
async function act(body, button) {
  busy = true;
  if (button) button.disabled = true;
  tg?.HapticFeedback?.impactOccurred?.("light");
  try {
    data = await call(body);
    draw();
    return true;
  } catch {
    tg?.showAlert?.("Не получилось. Попробуй ещё раз.");
    const status = document.getElementById("status");
    if (status) status.textContent = "Не получилось. Попробуй ещё раз.";
    if (button) button.disabled = false;
    return false;
  } finally {
    busy = false;
  }
}

async function openNote(id) {
  busy = true;
  try {
    noteOpen = await call({ action: "note_open", id });
    librarySection = "notes";
    tab = "queue";
    searchOpen = false;
    draw();
  } catch {
    document.getElementById("status").textContent = "Не удалось открыть заметку. Попробуй ещё раз.";
  } finally { busy = false; }
}

async function openLink(id) {
  busy = true;
  try {
    linkEdit = (await call({ action: 'link_open', id })).link;
    librarySection = linkEdit.kind === 'tg_post' ? 'posts' : linkEdit.kind === 'file' ? 'files' : 'links';
    tab = 'queue'; searchOpen = false; settingsOpen = false; draw();
  } catch { document.getElementById('status').textContent = 'Не удалось открыть материал.'; }
  finally { busy = false; }
}

async function loadLists() {
  busy = true;
  try { lists = (await call({ action: 'lists_list' })).lists || []; draw(); }
  catch { document.getElementById('status').textContent = 'Не удалось загрузить списки.'; }
  finally { busy = false; }
}

async function openListById(id) {
  busy = true;
  try {
    const { list } = await call({ action: 'list_open', id });
    listEdit = { ...list, items: (list.items || []).map(item => ({ ...item })) };
    tab = 'queue'; librarySection = 'lists'; searchOpen = false; settingsOpen = false; draw();
  } catch { document.getElementById('status').textContent = 'Не удалось открыть список.'; }
  finally { busy = false; }
}

root.addEventListener("click", async (event) => {
  if (busy) return;
  if (event.target.closest('[data-search-toggle]')) {
    searchOpen = !searchOpen;
    settingsOpen = false;
    draw();
    if (searchOpen) document.getElementById('global-search')?.focus();
    return;
  }
  if (event.target.closest('[data-settings-toggle]')) {
    settingsOpen = !settingsOpen;
    searchOpen = false;
    draw();
    if (settingsOpen && !settingsData) {
      busy = true;
      try { settingsData = await call({ action: 'settings_get' }); draw(); }
      catch { document.getElementById('status').textContent = 'Не удалось загрузить настройки.'; }
      finally { busy = false; }
    }
    return;
  }
  if (event.target.closest('[data-settings-save]')) {
    const contextMessages = Number(document.getElementById('context-messages')?.value);
    busy = true;
    try {
      const result = await call({ action: 'settings_set', context_messages: contextMessages });
      settingsData.contextMessages = result.contextMessages;
      draw(); document.getElementById('status').textContent = 'Настройки сохранены.';
    } catch { document.getElementById('status').textContent = 'Не удалось сохранить настройки.'; }
    finally { busy = false; }
    return;
  }
  if (event.target.closest('[data-search-run]')) {
    searchQuery = document.getElementById('global-search')?.value.trim() || '';
    if (searchQuery.length < 2) return;
    searchPage = 0;
    busy = true;
    try {
      const result = await call({ action: 'search', query: searchQuery, page: 0 });
      searchHits = result.hits; searchHasMore = result.hasMore; draw();
    }
    catch { document.getElementById('status').textContent = 'Поиск не сработал. Повтори запрос.'; }
    finally { busy = false; }
    return;
  }
  const pageButton = event.target.closest('[data-search-page]');
  if (pageButton) {
    const page = searchPage + Number(pageButton.dataset.searchPage);
    if (page < 0) return;
    busy = true;
    try {
      const result = await call({ action: 'search', query: searchQuery, page });
      searchHits = result.hits; searchPage = page; searchHasMore = result.hasMore; draw();
      document.getElementById('global-search')?.scrollIntoView({ block: 'start' });
    } catch { document.getElementById('status').textContent = 'Не удалось загрузить страницу. Повтори попытку.'; }
    finally { busy = false; }
    return;
  }
  const searchNote = event.target.closest('[data-search-note]');
  if (searchNote) { await openNote(Number(searchNote.dataset.searchNote)); return; }
  const searchLink = event.target.closest('[data-search-link]');
  if (searchLink) { await openLink(Number(searchLink.dataset.searchLink)); return; }
  const searchList = event.target.closest('[data-search-list]');
  if (searchList) { await openListById(Number(searchList.dataset.searchList)); return; }
  const recordButton = event.target.closest('[data-record-open]');
  if (recordButton) {
    const [kind, rawId] = String(recordButton.dataset.recordOpen).split(':');
    const id = Number(rawId);
    if (!RECORD_FIELDS[kind] || !Number.isSafeInteger(id) || id <= 0) return;
    busy = true;
    try {
      const { record } = await call({ action: 'record_open', kind, id });
      recordOpen = { kind, record }; draw();
    } catch { document.getElementById('status').textContent = 'Не удалось открыть запись.'; }
    finally { busy = false; }
    return;
  }
  if (event.target.closest('[data-record-back]')) { recordOpen = null; draw(); return; }
  if (event.target.closest('[data-record-save]') && recordOpen) {
    const { kind, record } = recordOpen;
    const changes = readRecordForm();
    busy = true;
    try {
      const result = await call({ action: 'record_save', kind, id: Number(record.id), changes });
      recordOpen = { kind, record: result.record };
      if (searchHits) searchHits = searchHits.map(hit => hit.kind === kind && Number(hit.id) === Number(record.id)
        ? { ...hit, title: result.record.title || result.record.person || result.record.name || hit.title } : hit);
      draw(); document.getElementById('status').textContent = 'Сохранено.';
      void load();
    } catch { document.getElementById('status').textContent = 'Не удалось сохранить. Проверь поля и повтори.'; }
    finally { busy = false; }
    return;
  }
  if (event.target.closest('[data-record-delete]') && recordOpen) {
    if (!confirm('Удалить запись? Её можно восстановить в корзине бота.')) return;
    const { kind, record } = recordOpen;
    busy = true;
    try {
      await call({ action: 'record_delete', kind, id: Number(record.id) });
      if (searchHits) searchHits = searchHits.filter(hit => hit.kind !== kind || Number(hit.id) !== Number(record.id));
      recordOpen = null; draw(); void load();
    } catch { document.getElementById('status').textContent = 'Не удалось удалить запись.'; }
    finally { busy = false; }
    return;
  }
  if (event.target.closest('[data-refresh]')) {
    clearVaultSecret();
    if (tab === "vault") { vaultEntries = null; draw(); await loadVault(); }
    else await load();
    return;
  }
  const tabButton = event.target.closest("[data-tab]");
  if (tabButton) {
    clearVaultSecret();
    searchOpen = false;
    settingsOpen = false;
    taskEdit = null;
    tab = tabButton.dataset.tab;
    draw();
    if (tab === "vault") await loadVault();
    else if (!data) await load();
    return;
  }

  if (event.target.closest("[data-close]")) { clearVaultSecret(); tg?.close?.(); return; }

  const section = event.target.closest('[data-library]');
  if (section) {
    librarySection = section.dataset.library; noteOpen = null; linkEdit = null; listEdit = null; draw();
    if (librarySection === 'lists' && lists === null) await loadLists();
    return;
  }
  if (event.target.closest('[data-list-back]')) { listEdit = null; draw(); return; }
  if (event.target.closest('[data-list-new]')) {
    listEdit = { id: 0, title: '', items: [], version: 0 };
    draw(); document.getElementById('list-title')?.focus(); return;
  }
  const openList = event.target.closest('[data-list-open]');
  if (openList) {
    const found = lists.find(list => Number(list.id) === Number(openList.dataset.listOpen));
    if (!found) return;
    listEdit = { ...found, items: (found.items || []).map(item => ({ ...item })) };
    draw(); return;
  }
  if (event.target.closest('[data-list-add]')) {
    readListForm(); listEdit.items.push({ text: '', done: false }); draw(); return;
  }
  const up = event.target.closest('[data-list-up]');
  const down = event.target.closest('[data-list-down]');
  const remove = event.target.closest('[data-list-remove]');
  if (up || down || remove) {
    readListForm();
    const i = Number((up || down || remove).dataset[up ? 'listUp' : down ? 'listDown' : 'listRemove']);
    if (remove) listEdit.items.splice(i, 1);
    else listEdit.items = moveListItem(listEdit.items, i, up ? -1 : 1);
    draw(); return;
  }
  if (event.target.closest('[data-list-save]')) {
    readListForm();
    const title = listEdit.title.trim();
    const items = listEdit.items.map(item => ({ ...item, text: item.text.trim() })).filter(item => item.text);
    if (!title) { document.getElementById('status').textContent = 'Укажи название списка.'; return; }
    busy = true;
    try {
      const { list } = await call({ action: listEdit.id ? 'list_save' : 'list_create',
        ...(listEdit.id ? { id: listEdit.id, version: listEdit.version } : {}), title, items });
      lists = [list, ...(lists || []).filter(entry => Number(entry.id) !== Number(list.id))];
      listEdit = null; draw(); document.getElementById('status').textContent = 'Список сохранён.';
    } catch { document.getElementById('status').textContent = 'Не удалось сохранить список. Обнови его и попробуй снова.'; }
    finally { busy = false; }
    return;
  }
  if (event.target.closest('[data-list-delete]')) {
    if (!confirm('Удалить список? Его можно восстановить из базы.')) return;
    busy = true;
    try {
      const id = Number(listEdit.id);
      await call({ action: 'list_delete', id, version: listEdit.version });
      lists = (lists || []).filter(entry => Number(entry.id) !== id);
      listEdit = null; draw();
    } catch { document.getElementById('status').textContent = 'Не удалось удалить список.'; }
    finally { busy = false; }
    return;
  }
  if (event.target.closest('[data-link-back]')) { linkEdit = null; draw(); return; }
  const editLink = event.target.closest('[data-link-edit]');
  if (editLink) { await openLink(Number(editLink.dataset.linkEdit)); return; }
  const saveLink = event.target.closest('[data-link-save]');
  if (saveLink) {
    const title = document.getElementById('link-title')?.value.trim();
    const tags = (document.getElementById('link-tags')?.value || '').split(',').map(s => s.trim()).filter(Boolean);
    if (!title) { document.getElementById('status').textContent = 'Укажи название.'; return; }
    busy = true;
    try {
      const { link } = await call({ action: 'link_update', id: Number(saveLink.dataset.linkSave), title, tags });
      data.queue = (data.queue || []).map(l => Number(l.id) === Number(link.id) ? { ...l, title: link.title, tags: link.tags } : l);
      linkEdit = null; draw(); document.getElementById('status').textContent = 'Сохранено.';
    } catch { document.getElementById('status').textContent = 'Не удалось сохранить материал.'; }
    finally { busy = false; }
    return;
  }
  const deleteLink = event.target.closest('[data-link-delete]');
  if (deleteLink) {
    if (!confirm('Удалить материал? Он останется доступен для восстановления в корзине.')) return;
    busy = true;
    try {
      const id = Number(deleteLink.dataset.linkDelete);
      await call({ action: 'link_delete', id });
      data.queue = (data.queue || []).filter(l => Number(l.id) !== id);
      linkEdit = null; draw();
    } catch { document.getElementById('status').textContent = 'Не удалось удалить материал.'; }
    finally { busy = false; }
    return;
  }
  if (event.target.closest('[data-note-back]')) { noteOpen = null; draw(); return; }
  if (event.target.closest('[data-note-new]')) {
    noteOpen = { note: { id: 0, title: '', body: '', tags: [] }, original: null, revisions: [] };
    draw(); document.getElementById('note-title')?.focus(); return;
  }
  const noteButton = event.target.closest('[data-note-open]');
  if (noteButton) { await openNote(Number(noteButton.dataset.noteOpen)); return; }
  if (event.target.closest('[data-note-original]') && noteOpen?.original) {
    document.getElementById('note-body').value = noteOpen.original;
    document.getElementById('status').textContent = 'Исходный текст вставлен. Нажми «Сохранить», чтобы применить.';
    return;
  }
  const revisionButton = event.target.closest('[data-note-revision]');
  if (revisionButton && noteOpen?.revisions) {
    const revision = noteOpen.revisions[Number(revisionButton.dataset.noteRevision)];
    if (revision) {
      document.getElementById('note-title').value = revision.title;
      document.getElementById('note-body').value = revision.body;
      document.getElementById('status').textContent = 'Версия вставлена. Нажми «Сохранить», чтобы применить.';
    }
    return;
  }
  const saveNote = event.target.closest('[data-note-save]');
  if (saveNote) {
    const id = Number(saveNote.dataset.noteSave);
    const title = document.getElementById('note-title')?.value.trim();
    const text = document.getElementById('note-body')?.value.trim();
    const tags = (document.getElementById('note-tags')?.value || '').split(',').map(s => s.trim()).filter(Boolean);
    if (!title || !text) { document.getElementById('status').textContent = 'Укажи название и текст.'; return; }
    busy = true;
    try {
      const { note } = await call({ action: id ? 'note_save' : 'note_create', ...(id ? { id } : {}), title, text, tags });
      data.notes = [note, ...(data.notes || []).filter(n => Number(n.id) !== Number(note.id))].slice(0, 40);
      noteOpen = await call({ action: 'note_open', id: Number(note.id) });
      draw(); document.getElementById('status').textContent = 'Сохранено.';
    } catch { document.getElementById('status').textContent = 'Не удалось сохранить заметку. Попробуй ещё раз.'; }
    finally { busy = false; }
    return;
  }
  const deleteNote = event.target.closest('[data-note-delete]');
  if (deleteNote) {
    if (!confirm('Удалить заметку? Её можно восстановить из корзины бота.')) return;
    busy = true;
    try {
      const id = Number(deleteNote.dataset.noteDelete);
      await call({ action: 'note_delete', id });
      data.notes = (data.notes || []).filter(n => Number(n.id) !== id);
      noteOpen = null; draw();
    } catch { document.getElementById('status').textContent = 'Не удалось удалить заметку.'; }
    finally { busy = false; }
    return;
  }

  if (tab === "vault") {

      clearVaultSecret(); vaultEditId = null;
      document.getElementById("vault-detail").innerHTML = ""; return;
    }
    const open = event.target.closest('[data-vault-open]');
    if (open) {
      busy = true;
      try {
        const result = await call({ action: "vault_reveal", id: Number(open.dataset.vaultOpen) });
        showVaultEntry(Number(open.dataset.vaultOpen), result.entry);

      finally { busy = false; }
      return;
    }
    const copyLogin = event.target.closest('[data-vault-copy-login]');
    const copyPassword = event.target.closest('[data-vault-copy-password]');
    if ((copyLogin || copyPassword) && vaultShown) {
      try {
        await navigator.clipboard.writeText(copyLogin ? vaultShown.login : vaultShown.password);
        document.getElementById("status").textContent = copyLogin ? "Логин скопирован." : "Пароль скопирован.";

      catch { vaultError(new Error("clipboard")); }
      return;

    if (event.target.closest('[data-vault-edit]') && vaultShown) {
      const entry = vaultShown;
      vaultEditId = entry.id;

      vaultShown = null;

    }
    if (event.target.closest('[data-vault-save]')) {

        document.getElementById("status").textContent = "Укажи сервис и пароль.";
        return;
      }
      busy = true;
      try {
        await call({ action: vaultEditId ? "vault_update" : "vault_create",
          ...(vaultEditId ? { id: vaultEditId } : {}), service, login, password, note });
        clearVaultSecret(); vaultEditId = null;
        document.getElementById("vault-password").value = "";
        document.getElementById("vault-detail").innerHTML = "";
        await loadVault();
      } catch (error) { vaultError(error); }
      finally { busy = false; }
      return;
    }
    if (event.target.closest('[data-vault-delete]') && vaultShown) {
      if (!confirm("Удалить этот пароль без возможности восстановления?")) return;
      const id = vaultShown.id;
      clearVaultSecret();
      busy = true;
      try { await call({ action: "vault_delete", id }); await loadVault(); }
      catch (error) { vaultError(error); }
      finally { busy = false; }
      return;
    }
  }

  const shift = event.target.closest("[data-cal]");
  if (shift) { calShift += Number(shift.dataset.cal); calPick = null; draw(); return; }

  const day = event.target.closest("[data-day]");
  if (day) { calPick = day.dataset.day; draw(); return; }

  // Создание и удаление. Удаление мягкое — запись уходит в корзину бота и
  // возвращается оттуда, поэтому спрашивать подтверждение здесь незачем.
  const addTask = event.target.closest("[data-task-add]");
  if (addTask) {
    const title = document.getElementById("task-title")?.value.trim();
    if (!title) return;
    await act({
      action: "task_add",
      title,
      due_on: document.getElementById("task-due")?.value || null,
    }, addTask);
    return;
  }

  const addEvent = event.target.closest("[data-event-add]");
  if (addEvent) {
    const title = document.getElementById("event-title")?.value.trim();
    if (!title) return;
    const time = document.getElementById("event-time")?.value || "12:00";
    await act({ action: "event_add", title, at: addEvent.dataset.eventAdd + "T" + time }, addEvent);
    return;
  }

  const dropTask = event.target.closest("[data-task-del]");
  if (dropTask) { await act({ action: "task_del", id: Number(dropTask.dataset.taskDel) }, dropTask); return; }

  if (event.target.closest('[data-task-back]')) { taskEdit = null; draw(); return; }
  const editTask = event.target.closest('[data-task-edit]');
  if (editTask) {
    taskEdit = data.tasks.find(t => Number(t.id) === Number(editTask.dataset.taskEdit));
    draw(); return;
  }
  if (event.target.closest('[data-task-save]') && taskEdit) {
    const title = document.getElementById('edit-task-title')?.value.trim();
    const due_on = document.getElementById('edit-task-due')?.value || null;
    const priority = Number(document.getElementById('edit-task-priority')?.value);
    if (!title) { document.getElementById('status').textContent = 'Укажи название дела.'; return; }
    busy = true;
    try {
      data = await call({ action: 'task_update', id: Number(taskEdit.id), title, due_on, priority });
      taskEdit = null; draw(); document.getElementById('status').textContent = 'Сохранено.';
    } catch { document.getElementById('status').textContent = 'Не удалось изменить дело.'; }
    finally { busy = false; }
    return;
  }

  const dropEvent = event.target.closest("[data-event-del]");
  if (dropEvent) { await act({ action: "event_del", id: Number(dropEvent.dataset.eventDel) }, dropEvent); return; }

  // Файл живёт в чате, а не в приложении: просим бота прислать его туда и
  // закрываемся — человек оказывается ровно там, где файл появился.
  const send = event.target.closest("[data-send]");
  if (send) {
    if (await act({ action: "send", id: Number(send.dataset.send) }, send)) tg?.close?.();
    return;
  }

  // Отметить сделанным можно прямо здесь: это единственное действие, за которым
  // не нужна карточка с историей, а тянуться за ним в чат — лишний шаг.
  const task = event.target.closest("[data-task]");
  const link = event.target.closest("[data-link]");
  if (!task && !link) return;
  busy = true;
  const active = task || link;
  active.disabled = true;

  tg?.HapticFeedback?.impactOccurred?.("light");
  try {
    data = await call(task
      ? { action: "task_done", id: Number(task.dataset.task) }
      : { action: "link_done", id: Number(link.dataset.link) });
    draw();
  } catch {
    document.getElementById('status').textContent = 'Не удалось сохранить изменение. Попробуй ещё раз.';
    active.disabled = false;
  } finally {
    busy = false;
  }
});

root.addEventListener("input", (event) => {
  if (event.target.id !== "vault-search") return;
  const query = event.target.value.trim().toLocaleLowerCase("ru-RU");
  document.querySelectorAll('[data-vault-open]').forEach((button) => {
    const row = button.closest('.item');
    const entry = vaultEntries?.find(e => Number(e.id) === Number(button.dataset.vaultOpen));
    if (row) row.hidden = !!query && !String(entry?.service || "").toLocaleLowerCase("ru-RU").includes(query);
  });
});
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    clearVaultSecret();
    const detail = document.getElementById("vault-detail");
    if (detail) detail.innerHTML = "";
  }
});
window.addEventListener("pagehide", clearVaultSecret);

function load() {
  if (snapshotRequest) return snapshotRequest;
  snapshotError = "";
  snapshotRequest = call({}).then(result => {
    data = result;
    if (tab !== "vault") draw();
  }).catch(error => {
    snapshotError = String(error.message) === "no-telegram"
      ? "Открой приложение из чата с ботом."
      : String(error.message) === "unauthorized"
      ? "Это приложение только для владельца бота."
      : "Не удалось загрузить данные. Проверь соединение и повтори.";
    if (tab !== "vault") draw();
  }).finally(() => { snapshotRequest = null; });
  return snapshotRequest;
}
draw();
document.addEventListener("DOMContentLoaded", () => {
  tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();
  draw();
  if (tab === "vault") void loadVault();
  else void load();
});
</script>
</body>
</html>
