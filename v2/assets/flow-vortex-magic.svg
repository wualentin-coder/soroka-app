<title id="flow-title">Flow — Digital Magic</title>
<desc id="flow-desc">Three original Flow ribbons converge into a hollow vortex. Redrawn three-ribbon Bezier silhouette with simplified inner curves and an open center, refracted rim light and depth. Color inherits the current theme.</desc>
